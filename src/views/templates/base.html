<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SISFARMA{% endblock %}</title>
    <!-- Asumiendo que usas Flask/FastAPI, así se llama al CSS en Jinja2 -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="dashboard-container">
        <!-- Sidebar de Navegación -->
        <aside class="sidebar">
            <div class="logo">💊 SISFARMA</div>
            <nav>
                <ul>
                    <li><a href="/ventas">Ventas</a></li>
                    <li><a href="/inventario">Inventario</a></li>
                    
                    {% if session.usuario.rol == 'Administrador' %}
                        <li><a href="/medicamentos">Medicamentos</a></li>
                        <li><a href="/compras">Compras a Proveedores</a></li>
                        <li><a href="/usuarios">Personal</a></li>
                        <li><a href="/reportes">Reportes</a></li>
                    {% endif %}
                </ul>
            </nav>
        </aside>

        <!-- Contenido Dinámico -->
        <main class="main-content">
            <header>
                <div class="user-info">
                    <span>Bienvenido, {{ current_user.nombre }}</span>
                    <span class="role-badge">{{ current_user.rol }}</span>
                    <a href="{{ url_for('auth_ctrl.logout') }}" style="margin-left: 12px; color: #c62828;">Cerrar sesión</a>
                </div>
            </header>
            
            <section class="content-body">
                <!-- Aquí se inyectará el código de medicamentos.html -->
                {% block content %}{% endblock %}
            </section>
        </main>
    </div>
</body>
</html>
