{% extends "base.html" %}

{% block title %}Editar Medicamento | SISFARMA{% endblock %}

{% block content %}
<div class="header-actions">
    <h2>Editar Medicamento</h2>
</div>

<form action="{{ action_url }}" method="POST" class="form-card">
    <div class="form-group">
        <label>Nombre del Medicamento</label>
        <input type="text" name="nombre" required value="{{ medicamento.nombre }}">
    </div>

    <div class="form-row">
        <div class="form-group">
            <label>Precio de Venta</label>
            <input type="number" step="0.01" name="precio" required value="{{ medicamento.precio }}">
        </div>
        <div class="form-group">
            <label>Categoría</label>
            <select name="id_categoria" required>
                <option value="">Seleccione...</option>
                {% for categoria in categorias %}
                    <option value="{{ categoria.id_categoria }}" {% if categoria.nombre == medicamento.categoria_nombre %}selected{% endif %}>{{ categoria.nombre }}</option>
                {% endfor %}
            </select>
        </div>
    </div>

    <div class="form-group">
        <label>Descripción</label>
        <textarea name="descripcion" rows="3">{{ medicamento.descripcion }}</textarea>
    </div>

    <div class="modal-footer">
        <a href="{{ url_for('medicamentos.index') }}" class="btn-secondary">Cancelar</a>
        <button type="submit" class="btn-primary">Guardar cambios</button>
    </div>
</form>
{% endblock %}
