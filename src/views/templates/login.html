<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión | SISFARMA</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body style="display: flex; justify-content: center; align-items: center; height: 100vh; background: #e9ecef;">
    
    <div class="modal-content" style="width: 400px;">
        <h2 style="text-align: center; margin-bottom: 20px;">💊 SISFARMA</h2>
        
        {% if error %}
            <div style="background: #ffebee; color: #c62828; padding: 10px; border-radius: 4px; margin-bottom: 15px; text-align: center;">
                {{ error }}
            </div>
        {% endif %}

        <form action="/login" method="POST">
            <div class="form-group">
                <label>Nombre de Usuario</label>
                <input type="text" name="nombre" required placeholder="Ej. Carlos Mendoza">
            </div>
            <div class="form-group">
                <label>Contraseña</label>
                <input type="password" name="contrasena" required>
            </div>
            <button type="submit" class="btn-primary" style="width: 100%; margin-top: 10px;">Ingresar</button>
        </form>
    </div>

</body>
</html>
